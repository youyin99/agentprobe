[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "1.0.0"
description = "Deterministic, evidence-based security probe for a document assistant agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "youyin99"}]
keywords = ["agent-security", "prompt-injection", "llm-security", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentprobe = "agentprobe.cli:main"

[tool.setuptools.packages.find]
include = ["agentprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
